name: petra-stdlib (built using Petra Verifier)
on:
  pull_request_target:
    branches: [main]
  workflow_dispatch: # included for manual run button

jobs:
  call-security-engine:
    permissions:
        pull-requests: write
        issues: write
        contents: read
        actions: read
    uses: petracode-labs/build-engine/.github/workflows/petra-stdlib-engine.yml@main
    with:
      # This ensures the build actually tests the FORK'S code, or falls back to your trusted main branch
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      PMDT: ${{ secrets.PMDT }}
